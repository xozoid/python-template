name: CI
on:
  workflow_call:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14", "3.15"]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
      - run: uv sync --locked --no-default-groups --group test
      - run: uv run --no-sync pytest
  ruff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.15"
          enable-cache: true
      - run: uv sync --locked --no-default-groups --group lint
      - run: uv run --no-sync ruff check .
  types:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.15"
          enable-cache: true
      - run: uv sync --locked --no-default-groups --group types
      - run: uv run --no-sync basedpyright
  formatting:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.15"
          enable-cache: true
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: uv sync --locked --no-default-groups --group format
      - run: npm ci
      - run: uv run --no-sync ruff format --check .
      - run: npm exec --no -- prettier --check .
      - run: uv run --no-sync taplo fmt --check '*.toml'
      - run: uv run --no-sync prek run yamlfmt --all-files
  spelling:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.15"
          enable-cache: true
      - run: uv sync --locked --no-default-groups --group spell
      - run: uv run --no-sync codespell --skip=node_modules .
  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.15"
          enable-cache: true
      - run: uv sync --locked --no-default-groups --group coverage
      - run: uv run --no-sync coverage run -m pytest
      - run: uv run --no-sync coverage report
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: coverage-data
          path: .coverage
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.15"
          enable-cache: true
      - run: uv build
      - run: uv venv --no-project /tmp/wheel-test
      - run: uv pip install --python /tmp/wheel-test/bin/python dist/*.whl
      - run: /tmp/wheel-test/bin/python -c "import new_project"

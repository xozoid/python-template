name: CI
on:
  workflow_call:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14", "3.15"]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
      - run: uv sync --locked --all-groups
      - run: uv run pytest
  ruff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.15"
          enable-cache: true
      - run: uv sync --locked --all-groups
      - run: uv run ruff check .
  types:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.15"
          enable-cache: true
      - run: uv sync --locked --all-groups
      - run: uv run basedpyright
  formatting:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.15"
          enable-cache: true
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: uv sync --locked --all-groups
      - run: npm ci
      - run: uv run ruff format --check .
      - run: npx prettier --check .
      - run: uv run taplo fmt --check '*.toml'
      - run: uv run prek run yamlfmt --all-files
  spelling:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.15"
          enable-cache: true
      - run: uv sync --locked --all-groups
      - run: uv run codespell --skip=node_modules .
  vale:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: errata-ai/vale-action@reviewdog
        with:
          files: README.md CONTRIBUTING.md
  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.15"
          enable-cache: true
      - run: uv sync --locked --all-groups
      - run: uv run coverage run -m pytest
      - run: uv run coverage report
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: coverage-data
          path: .coverage
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.15"
          enable-cache: true
      - run: uv sync --locked --all-groups
      - run: uv build
      - run: uv venv --no-project /tmp/wheel-test
      - run: uv pip install --python /tmp/wheel-test/bin/python dist/*.whl
      - run: /tmp/wheel-test/bin/python -c "import new_project"

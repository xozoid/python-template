name: Docs CI
on:
  pull_request:
    branches: [main]
    paths:
      - README.md
      - CONTRIBUTING.md
permissions:
  contents: read
jobs:
  vale:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install Vale
        run: |
          curl -fsSL https://github.com/vale-cli/vale/releases/latest/download/vale_Linux_64-bit.tar.gz \
            | sudo tar -xz -C /usr/local/bin vale
          vale --version
      - uses: actions/cache@v4
        id: vale-styles
        with:
          path: .vale/styles
          key: vale-${{ runner.os }}-${{ hashFiles('.vale.ini') }}
      - name: Sync Vale styles
        if: steps.vale-styles.outputs.cache-hit != 'true'
        run: |
          attempt=0
          until vale sync; do
            attempt=$((attempt + 1))
            if [ "$attempt" -ge 5 ]; then
              exit 1
            fi
            sleep "$((attempt * 5))"
          done
      - name: Lint documentation
        run: vale README.md CONTRIBUTING.md

name: Publish to PyPI
on:
  release:
    types: [published]
permissions:
  contents: read
jobs:
  validate:
    uses: ./.github/workflows/ci.yml
  publish:
    needs: validate
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/new-project
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.15"
      - run: uv build
      - uses: pypa/gh-action-pypi-publish@release/v1
